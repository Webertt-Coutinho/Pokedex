<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <img src="assets/home.png" alt="Logo" class="header-logo">
    <div class="header-buttons">
      <button class="btn">Home</button>
      <button class="btn">Pokédex</button>
    </div>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Faça uma busca pelo nome do pokémon" class="search-input">
    <button class="search-button">
      <img src="assets/search.svg" alt="Buscar">
    </button>
  </div>



  <script type="module" src="js/main.js"></script>
</body>
</html>
