<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <a href="#" class="header-logo-link">
      <img src="assets/home.png" alt="Logo" class="header-logo">
    </a>
    <div class="header-buttons">
      <a href="#" class="btn active" >Home</a>
      <a href="#" class="btn">Pokédex</a>
    </div>
  </header>

  <div class="search-filter-wrapper">
    <div class="search-container">
      <input type="text" id="searchInput" autocomplete="off" placeholder="Faça uma busca pelo nome do pokémon" class="search-input">
      <button id="search-button" class="search-button">
        <img src="assets/search.svg" alt="Buscar">
      </button>
    </div>

    <div class="filter-container">
    </div>
  </div>


  <!-- <div class="filter-container"></div> -->

  <div id="loading" class="loading" style="display: none;">
    <div class="spinner"></div>
  </div>

  <div id="pokemon-container" class="pokemon-container"></div>

  <div id="pagination" class="pagination">
    <button id="prev-btn" type="button">
      <img src="./assets/prev.svg" alt="Anterior" width="16" height="16">
      Anterior
    </button>
    <div id="page-numbers"></div>
    <button id="next-btn" type="button">
      Próximo
      <img src="./assets/next.svg" alt="Próximo" width="16" height="16">
    </button>
    <button id="reset-search" style="display: none;">Voltar para lista completa</button>
  </div>

  <div id="all-btn-container" class="all-btn-container" style="display: none;">
    <button id="all-btn" class="btn">Todos os Pokémon</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
